# Every push to main deploys arristype.com: the site (wrangler.jsonc) and the
# www Worker that sends www.arristype.com to it (worker/www.jsonc). Then it
# looks at the live site from outside: the page, a byte range of a film,
# www, and that the repository's own files stay off it.
#
# Needs the repository secret CLOUDFLARE_API_TOKEN (the Edit Cloudflare
# Workers template, plus DNS edit, for the arristype.com zone); without it
# it deploys nothing and says so. CLOUDFLARE_ACCOUNT_ID is only needed if
# the token reaches more than one account: otherwise wrangler finds it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Once published, refresh the font assets even without a website commit.
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.156.0
      WRANGLER_SEND_METRICS: 'false'
      RELEASE_VERSION: '2.002'
    steps:
      - uses: actions/checkout@v4
      - name: Published 2.002 font release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$RELEASE_VERSION" --repo huntrontrakkr/arris-type --json tagName > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Should this deployment run?
        id: needed
        env:
          EVENT: ${{ github.event_name }}
          PUBLISHED: ${{ steps.release.outputs.published }}
        run: |
          if [ "$EVENT" != schedule ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$PUBLISHED" != true ]; then echo "yes=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          live=$(curl -fsS -H 'Cache-Control: no-cache' https://arristype.com/data/font.json \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('version', ''))" 2>/dev/null || true)
          if [ "$live" = "$RELEASE_VERSION" ]; then
            echo "yes=false" >> "$GITHUB_OUTPUT"
          else
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.needed.outputs.yes == 'true' && steps.release.outputs.published == 'true'
        with:
          python-version: '3.12'
      - name: Build website assets from the published font ZIP
        if: steps.needed.outputs.yes == 'true' && steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install 'fonttools>=4.67,<5' 'brotli>=1.2,<2'
          mkdir -p "$RUNNER_TEMP/arris-release"
          gh release download "v$RELEASE_VERSION" --repo huntrontrakkr/arris-type \
            --pattern "Arris-$RELEASE_VERSION.zip" --dir "$RUNNER_TEMP/arris-release"
          python tools/fonts.py "$RUNNER_TEMP/arris-release/Arris-$RELEASE_VERSION.zip"
          python -c "import json; from pathlib import Path; assert json.loads(Path('data/font.json').read_text())['version'] == '$RELEASE_VERSION'"
      - name: Token
        id: token
        if: steps.needed.outputs.yes == 'true'
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::The CLOUDFLARE_API_TOKEN secret is not set yet, so nothing is deployed."; fi
      - name: The site
        if: steps.token.outputs.ok == 'true' && steps.needed.outputs.yes == 'true'
        run: |
          if [ -n "$ACCOUNT" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"; fi
          $WRANGLER deploy
      - name: www
        if: steps.token.outputs.ok == 'true' && steps.needed.outputs.yes == 'true'
        run: |
          if [ -n "$ACCOUNT" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"; fi
          $WRANGLER deploy --config worker/www.jsonc
      - name: The live site
        if: steps.token.outputs.ok == 'true' && steps.needed.outputs.yes == 'true'
        # a new custom domain can take a few minutes for its certificate
        run: |
          ready() {
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$1")
              [ "$code" = "$2" ] && return 0
              echo "waiting for $1 ($i: $code)"; sleep 20
            done
            return 1
          }
          ready https://arristype.com/ 200
          ready https://www.arristype.com/kapa/ 301
          show() { printf '%-34s %s\n' "$1" "$2"; }
          show "https://arristype.com/" "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://arristype.com/)"
          show "a byte range of the board film" "$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=1000-1999' https://arristype.com/media/board.mp4) $(curl -s -D - -o /dev/null -H 'Range: bytes=1000-1999' https://arristype.com/media/board.mp4 | grep -i '^content-range' | tr -d '\r')"
          show "https://www.arristype.com/kapa/" "$(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' https://www.arristype.com/kapa/)"
          show "/README.md (kept back)" "$(curl -s -o /dev/null -w '%{http_code}' https://arristype.com/README.md)"
          show "/nope (the 404 page)" "$(curl -s -o /dev/null -w '%{http_code}' https://arristype.com/nope)"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://arristype.com/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=1000-1999' https://arristype.com/media/board.mp4)" = 206
          test "$(curl -s -o /dev/null -w '%{http_code}' https://arristype.com/README.md)" = 404
          test "$(curl -s -o /dev/null -w '%{redirect_url}' https://www.arristype.com/kapa/)" = https://arristype.com/kapa/
          # Only claim the release reached the website once its own font
          # manifest matches the release ZIP used by this deployment.
          if [ "${{ steps.release.outputs.published }}" = true ]; then
            live=""
            for i in $(seq 1 30); do
              live=$(curl -fsS -H 'Cache-Control: no-cache' https://arristype.com/data/font.json \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('version', ''))" 2>/dev/null || true)
              [ "$live" = "$RELEASE_VERSION" ] && break
              sleep 20
            done
            echo "Live font version: $live"
            test "$live" = "$RELEASE_VERSION"
          fi
