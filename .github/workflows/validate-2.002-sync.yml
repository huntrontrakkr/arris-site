# Branch-only smoke test. Remove after checking the release ZIP conversion.
name: Verify website font ZIP conversion
on:
  push:
    branches: [release/arris-2.002-site-sync]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download published v2.001 font and regenerate website assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install 'fonttools>=4.67,<5' 'brotli>=1.2,<2'
          mkdir -p "$RUNNER_TEMP/arris-release"
          gh release view v2.001 --repo huntrontrakkr/arris-type --json tagName
          gh release download v2.001 --repo huntrontrakkr/arris-type \
            --pattern 'Arris-2.001.zip' --dir "$RUNNER_TEMP/arris-release"
          python tools/fonts.py "$RUNNER_TEMP/arris-release/Arris-2.001.zip"
      - name: Verify generated website content, link, features and fonts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/font.json').read_text())
          assert data['version'] == '2.001', data['version']
          page = Path('index.html').read_text()
          assert 'Arris-2.001.zip' in page
          assert 'data-font="version">2.001' in page
          css = Path('css/fonts.css').read_text()
          assert 'arris-mono-400.woff2' in css
          assert Path('fonts/arris-mono-400.woff2').stat().st_size > 0
          assert Path('fonts/arris.woff2').stat().st_size > 0
          print('Website ZIP conversion and metadata: PASS')
          PY
