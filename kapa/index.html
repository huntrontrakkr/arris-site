<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0347 KAPA</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../css/fonts.css">
<style>
  :root { --void: #04080b; --ink: #d8f6ff; --dim: #4f7480; --leak: #3fd6ff; --line: #12303a; --cut: #e0402a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100svh; background: var(--void); color: var(--ink); font-family: "Arris Mono", ui-monospace, monospace;
    display: grid; place-content: center; gap: 22px; padding: 32px max(20px, env(safe-area-inset-right, 0px)) 32px max(20px, env(safe-area-inset-left, 0px)); }
  main { width: min(100%, 880px); display: grid; gap: 22px; }
  h1 { margin: 0; font-family: "Arris", sans-serif; font-weight: 700; font-size: clamp(48px, 12vw, 120px); line-height: .9; font-variation-settings: "GRAD" -60; }
  img { display: block; width: 100%; height: auto; opacity: .5; filter: saturate(.4) hue-rotate(-10deg);
    clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px)); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 24px; margin: 0; font-size: 14px; }
  dt { color: var(--dim); } dd { margin: 0; }
  .blink { color: var(--leak); animation: b 1.2s steps(1) infinite; }
  @keyframes b { 50% { opacity: 0; } }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 18px; }
  label { color: var(--dim); font-size: 13px; letter-spacing: .1em; }
  input { font: inherit; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; background: #071218; color: var(--leak); border: 1px solid var(--line);
    padding: 8px 12px; width: min(100%, 300px); outline: none; }
  input:focus { border-color: var(--leak); }
  button { font: inherit; font-size: 13px; letter-spacing: .1em; background: none; color: var(--ink); border: 1px solid var(--ink); padding: 9px 16px; cursor: pointer; }
  .credit { font-size: 11px; color: var(--dim); margin: 0; }
  .hint { width: 100%; font-size: 11.5px; color: var(--dim); margin: 0; }
  .denied { color: var(--cut); }
  pre { margin: 0; white-space: pre-wrap; font: inherit; font-size: clamp(13px, 1.8vw, 16px); line-height: 1.7; color: var(--leak); min-height: 1em; }
  a { color: var(--dim); font-size: 13px; }
  .frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 14px; }
  .frames figure { margin: 0; animation: in .6s ease-out both; }
  .frames img { opacity: 1; filter: none; }
  .frames figcaption { font-size: 11px; color: var(--dim); margin-top: 6px; letter-spacing: .06em; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { .frames figure { animation: none; } }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>0347 KAPA</h1>
  <img src="../media/survey.jpg" alt="The survey display, dimmed">
  <dl>
    <dt>SURVEY</dt><dd>4-A</dd>
    <dt>SLICE</dt><dd>33 / 33</dd>
    <dt>UNCLASSIFIED</dt><dd>14.2 %</dd>
    <dt>MANIFEST</dt><dd>DOCK 07 · BAY 09 · 03:47</dd>
    <dt>ACCESS</dt><dd class="blink" id="state">PENDING</dd>
  </dl>
  <form id="gate" autocomplete="off">
    <label for="code">ACCESS CODE</label>
    <input id="code" name="code" spellcheck="false" autocapitalize="characters">
    <button type="submit">OPEN</button>
    <p class="hint">ASK AT THE GLASSHOUSE. READ IT BEFORE IT FILLS IN.</p>
  </form>
  <pre id="out" aria-live="polite"></pre>
  <div class="frames" id="frames"></div>
  <a href="../">← back to the dock</a>
  <p class="credit" id="credit" hidden>Saturn: NASA/JPL/Space Science Institute. Roses: Pierre-Joseph Redouté.</p>
</main>
<script>
(() => {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const state = document.getElementById('state'), out = document.getElementById('out'), form = document.getElementById('gate'), frames = document.getElementById('frames');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  async function keyFor(code, sealed) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(sealed.salt), iterations: sealed.iter }, base,
      { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  const open = (key, iv, ct) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(iv) }, key, ct);
  function type(text) {
    return new Promise(done => {
      if (still) { out.textContent = text; done(); return; }
      let i = 0;
      (function step() { out.textContent = text.slice(0, i); i += 2; if (i <= text.length + 1) setTimeout(step, 18); else done(); })();
    });
  }
  async function show(key, files) {
    for (const f of files) {
      const ct = b64((await (await fetch(f.file)).text()).trim());
      const url = URL.createObjectURL(new Blob([await open(key, f.iv, ct)], { type: f.type }));
      const fig = document.createElement('figure'), a = document.createElement('a'), img = document.createElement('img'), cap = document.createElement('figcaption');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      img.src = url; img.alt = f.caption; cap.textContent = f.caption;
      a.appendChild(img); fig.append(a, cap); frames.appendChild(fig);
      if (!still) await new Promise(r => setTimeout(r, 450));
    }
  }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const code = document.getElementById('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    state.textContent = 'CHECKING'; state.className = 'blink';
    try {
      const sealed = await (await fetch('sealed.json')).json();
      const key = await keyFor(code, sealed);
      const msg = JSON.parse(new TextDecoder().decode(await open(key, sealed.iv, b64(sealed.ct))));
      state.textContent = 'GRANTED'; state.className = '';
      form.hidden = true;
      await type(msg.text);
      await show(key, msg.files);
      document.getElementById('credit').hidden = false;
    } catch (err) {
      state.textContent = 'DENIED'; state.className = 'denied';
    }
  });
})();
</script>
</body>
</html>
